{{ define "main" }}
<section class="page-hero">
  <div class="shell">
    <p class="eyebrow">CHANGTAI MEDICAL</p>
    <h1>{{ with .Title }}{{ . }}{{ else }}企业信息{{ end }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </div>
</section>
<section class="section">
  <div class="shell portal-content">
    {{ .Content }}
    {{ range .Pages }}
    <article>
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
    </article>
    {{ end }}
  </div>
</section>
{{ end }}
